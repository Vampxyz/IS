<!DOCTYPE html>
<html lang="en">
  <head>

    <link

      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css"

          <a href="#">Bebidas</a>

      <!-- Products -->
      <h1>Produtos em Destaque</h1>

      <div id="products">

        <button id="addbtn"><i class="fi fi-rr-plus"></i></button>
        
        <!-- Product -->
        <!-- The product will be added here -->
